[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "saham-signal-backend"
version = "0.1.0"
description = "Shared modular backend for Saham Signal API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.49.0",
  "pydantic-settings==2.13.1",
  "psycopg[binary]==3.3.3",
  "redis==7.3.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "ruff==0.15.6",
  "mypy==1.19.1",
  "jsonschema==4.25.1",
  "types-jsonschema==4.25.1.20251009",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saham_signal"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
