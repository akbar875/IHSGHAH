name: Web checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    # Pin a Chromium-supported OS; ubuntu-latest may advance before Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.work/paper-browser.json
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-browser-${{ github.run_id }}
          path: .work/paper-browser.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic browser latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-browser-${{ github.run_id }}
          path: .work/web-test-results/**/operations-load.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
