name: Runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    uses: ./.github/workflows/scaffold.yml
  contracts:
    uses: ./.github/workflows/contracts.yml
  web:
    uses: ./.github/workflows/web.yml
  backend:
    uses: ./.github/workflows/api.yml
  infrastructure:
    uses: ./.github/workflows/local-infra.yml
  paper-acceptance:
    name: Paper acceptance qualification
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-*-${{ github.run_id }}
          path: .work/paper-evidence
          merge-multiple: true
      - run: python scripts/check-paper-acceptance.py .work/paper-evidence/paper-backend.xml .work/paper-evidence/paper-browser.json .work/paper-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-acceptance-${{ github.run_id }}
          path: .work/paper-acceptance.json
          if-no-files-found: error
          retention-days: 14
  quality:
    name: Runtime quality gate
    needs: [scaffold, contracts, web, backend, infrastructure, paper-acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if any(job["result"] != "success" for job in results.values()):
              raise SystemExit("Runtime checks failed, were cancelled, or were skipped")
          PY
