name: Backend checks (API and worker)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: saham_signal_research
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: saham_signal_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saham_signal_research"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PERSISTENCE_TEST_DSN: postgresql://saham_signal_research:ci_disposable_only@127.0.0.1:5432/saham_signal_research
      OPERATIONS_REPORT: ${{ github.workspace }}/.work/operations-load.json
      OPERATIONS_RESTORE_REPORT: ${{ github.workspace }}/.work/operations-restore.json
      PERSISTENCE_PAPER_TEST_DSN: postgresql://saham_signal_research:ci_disposable_only@127.0.0.1:5432/saham_signal_paper
      PAPER_SIMULATION_REPORT: ${{ github.workspace }}/.work/paper-simulation.json
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/api/.python-version
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check ../../scripts/check-backend-smoke.py
      - run: uv run --locked ruff format --check ../../scripts/check-backend-smoke.py
      - run: uv run --locked ruff check ../../scripts/check-paper-acceptance.py
      - run: uv run --locked ruff format --check ../../scripts/check-paper-acceptance.py
      - run: uv run --locked mypy
      - run: mkdir -p ../../.work
      - name: Create disposable paper database
        run: |
          uv run --locked python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["PERSISTENCE_TEST_DSN"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE saham_signal_paper")
          PY
      - run: uv run --locked pytest --junitxml=../../.work/paper-backend.xml
      - name: Retain paper acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-backend-${{ github.run_id }}
          path: .work/paper-*
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic operations qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-backend-${{ github.run_id }}
          path: .work/operations-*.json
          if-no-files-found: ignore
          retention-days: 14
      - run: uv build --no-sources
      - name: Smoke installed wheel with locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv venv "$RUNNER_TEMP/backend-smoke"
          uv pip sync --require-hashes --python "$RUNNER_TEMP/backend-smoke/bin/python" "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/backend-smoke/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/backend-smoke/bin/python" -I ../../scripts/check-backend-smoke.py
