name: Contract checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/contracts
      - run: npm run check
        working-directory: packages/contracts
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/api/.python-version
      - run: python -m pip install -r packages/contracts/requirements-test.txt
      - run: python packages/contracts/test/check_python.py
