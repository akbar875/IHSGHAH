name: Scaffold checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
      - run: node scripts/check-scaffold.mjs
      - run: node scripts/publish-issues.mjs
